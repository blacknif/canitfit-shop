<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nook &amp; Co.</title>
  <meta name="description" content="Demo furniture store for the Can It Fit app.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <span class="wordmark">Nook &amp; Co.</span>
      <span class="label">Demo store</span>
    </div>
  </header>

  <main class="wrap">
    <h1 class="title">Furniture</h1>
    <ul class="list" id="products" aria-label="Products">
      <li class="item desc" id="status">Loading...</li>
    </ul>
    <p class="note label" id="get-app">View in your room needs the Can It Fit app on an Android phone.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="label">School project. Nothing here is for sale. 3D models: <a href="https://polyhaven.com" rel="noopener">Poly Haven</a> (CC0).</p>
    </div>
  </footer>
</body>
</html>
